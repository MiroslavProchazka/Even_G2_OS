name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: beast-g2

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20.18.0 is the floor declared in engines, 22 is the next LTS line.
        node: ['20.18.0', '22']
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: beast-g2/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject tracked secrets and build artifacts
        working-directory: .
        run: |
          set -eu
          offenders=$(git ls-files -- \
            'beast-g2/.env' \
            'beast-g2/.env.*' \
            'beast-g2/app.device.json' \
            '*.ehpk' \
            '*.ehpk.sha256' | grep -v '^beast-g2/\.env\.example$' || true)
          if [ -n "$offenders" ]; then
            printf 'These files must not be tracked:\n%s\n' "$offenders" >&2
            exit 1
          fi
